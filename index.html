<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎉</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0d0d1a; color: white; overflow: hidden; text-align: center; }
        
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; justify-content: center; align-items: center; position: absolute; top: 0; left: 0; padding: 20px; transition: all 0.5s ease; }
        .active { display: flex; }

        button { background: linear-gradient(45deg, #ff4757, #ff6b81); color: white; border: none; padding: 12px 28px; font-size: 18px; border-radius: 25px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); transition: 0.3s; }
        button:hover { transform: scale(1.05); }

        /* Screen 1: Cake Cutting */
        .cake { font-size: 80px; position: relative; cursor: pointer; }
        .candle { font-size: 30px; position: absolute; top: -30px; left: 35px; animation: flicker 0.3s infinite alternate; }
        @keyframes flicker { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        /* Screen 2: Balloon Pop */
        .balloon-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 300px; }
        .balloon { font-size: 50px; cursor: pointer; transition: transform 0.1s; }
        .balloon:active { transform: scale(0.5); }

        /* Screen 3: Quiz */
        .quiz-box { background: rgba(255, 255, 255, 0.1); padding: 25px; border-radius: 15px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); width: 90%; max-width: 400px; }
        .quiz-options button { display: block; width: 100%; margin: 10px 0; background: #33334d; }

        /* Screen 4: Fireworks & Grand Wish */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .wish-text { font-size: 3rem; font-weight: bold; text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f; animation: glow 1.5s ease-in-out infinite alternate; color: #fff; }
        @keyframes glow { from { text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f; } to { text-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff; } }
        .character-img { width: 150px; margin-top: 20px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>

    <!-- SCREEN 1: CAKE CUTTING -->
    <div id="screen1" class="screen active">
        <h2>Tap the candle to blow it & cut the cake! 🎂</h2>
        <br><br>
        <div class="cake" onclick="blowCandle()">
            <span id="candle" class="candle">🕯️</span>
            🎂
        </div>
        <p id="cake-status" style="margin-top:20px; color:#aaa;"></p>
        <button id="next1" style="display:none;" onclick="nextScreen(2)">Next Step 👉</button>
    </div>

    <!-- SCREEN 2: BALLOON POP -->
    <div id="screen2" class="screen">
        <h2>Pop all the balloons to find the way! 🎈</h2>
        <br><br>
        <div class="balloon-container">
            <div class="balloon" onclick="popBalloon(this)">🎈</div>
            <div class="balloon" onclick="popBalloon(this)">🎈</div>
            <div class="balloon" onclick="popBalloon(this)">🎈</div>
            <div class="balloon" onclick="popBalloon(this)">🎈</div>
            <div class="balloon" onclick="popBalloon(this)">🎈</div>
            <div class="balloon" onclick="popBalloon(this)">🎈</div>
        </div>
        <button id="next2" style="display:none;" onclick="nextScreen(3)">Next Step 👉</button>
    </div>

    <!-- SCREEN 3: MINI QUIZ -->
    <div id="screen3" class="screen">
        <div class="quiz-box">
            <h3 id="question">Who loves you the most? 🤨</h3>
            <div class="quiz-options">
                <button onclick="checkAnswer(true)">The person who sent you this link! ❤️</button>
                <button onclick="checkAnswer(false)">No one 😢</button>
                <button onclick="checkAnswer(false)">Food 🍔</button>
            </div>
            <p id="quiz-feedback" style="margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- SCREEN 4: FIREWORKS & GRAND WISH -->
    <div id="screen4" class="screen">
        <canvas id="fireworksCanvas"></canvas>
        <h1 class="wish-text">HAPPY BIRTHDAY! 🎉🥳</h1>
        <p style="font-size: 20px; margin-top: 10px; max-width: 500px;">May your day be filled with lots of love, laughter, and your favorite snacks! You are awesome! ❤️</p>
        
        <!-- Shinchan/Doraemon Cartoon Representation -->
        <!-- Tum yahan apni pasand ke character ki image link dal sakte ho -->
        <img class="character-img" src="https://i.pinimg.com/originals/82/32/79/82327914092b7cf53f19e487dbdb0f33.gif" alt="Shinchan/Doraemon">
        
        <p style="margin-top:15px; font-size:14px; color:#ff6b81;">🔊 Volume Up! Character is wishing you!</p>
    </div>

    <!-- AUDIO ELEMENT (Shinchan/Doraemon Wish Audio) -->
    <!-- REPLACE 'AUDIO_URL_HERE' WITH YOUR ACTUAL AUDIO LINK -->
    <audio id="birthdayAudio" src="AUDIO_URL_HERE" preload="auto"></audio>

    <script>
        // Audio Object
        const audio = document.getElementById('birthdayAudio');

        // Navigation Function
        function nextScreen(screenNum) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen' + screenNum).classList.add('active');
            
            // If it's the final screen, start fireworks and play audio
            if(screenNum === 4) {
                startFireworks();
                audio.play().catch(e => console.log("Audio play blocked by browser. User interaction needed."));
            }
        }

        // Screen 1: Blow Candle Logic
        function blowCandle() {
            document.getElementById('candle').style.display = 'none';
            document.getElementById('cake-status').innerText = "Yay! Cake cut successfully! 🍰✨";
            document.getElementById('next1').style.display = 'inline-block';
        }

        // Screen 2: Balloon Pop Logic
        let poppedCount = 0;
        function popBalloon(element) {
            if(element.innerText === "🎈") {
                element.innerText = "💥";
                poppedCount++;
                setTimeout(() => { element.style.visibility = 'hidden'; }, 300);
                
                if(poppedCount === 6) {
                    document.getElementById('next2').style.display = 'inline-block';
                }
            }
        }

        // Screen 3: Quiz Logic
        function checkAnswer(isCorrect) {
            const feedback = document.getElementById('quiz-feedback');
            if(isCorrect) {
                feedback.innerHTML = "Correct! 🥰 Moving to your surprise...";
                feedback.style.color = "#2ed573";
                setTimeout(() => { nextScreen(4); }, 2000);
            } else {
                feedback.innerHTML = "Wrong answer! Try again 😜";
                feedback.style.color = "#ff4757";
            }
        }

        // Screen 4: Fireworks Animation Code
        function startFireworks() {
            const canvas = document.getElementById('fireworksCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];

            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.radius = Math.random() * 3 + 1;
                    this.velocity = {
                        x: (Math.random() - 0.5) * 8,
                        y: (Math.random() - 0.5) * 8
                    };
                    this.alpha = 1;
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }
                update() {
                    this.draw();
                    this.velocity.y += 0.05; // gravity effect
                    this.x += this.velocity.x;
                    this.y += this.velocity.y;
                    this.alpha -= 0.015;
                }
            }

            function spawnFirework() {
                const x = Math.random() * canvas.width;
                const y = Math.random() * (canvas.height * 0.6);
                const colors = ['#ff004f', '#00ff66', '#00ffff', '#ffff00', '#ff00ff'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                for (let i = 0; i < 40; i++) {
                    particles.push(new Particle(x, y, randomColor));
                }
            }

            // Spawn automatically every 800ms
            setInterval(spawnFirework, 800);

            function animate() {
                requestAnimationFrame(animate);
                ctx.fillStyle = 'rgba(13, 13, 26, 0.2)'; // Dark Mode Background trail
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                particles.forEach((particle, index) => {
                    if (particle.alpha > 0) {
                        particle.update();
                    } else {
                        particles.splice(index, 1);
                    }
                });
            }
            animate();
        }
    </script>
</body>
</html>
