<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Custom Birthday Wish</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="setup-form" class="card form-card">
        <h2>✨ Customize Your Wish ✨</h2>
        
        <div class="input-group">
            <label>1. Upload Photo:</label>
            <input type="file" id="user-image" accept="image/*">
        </div>

        <div class="input-group">
            <label>2. Birthday Message:</label>
            <textarea id="user-text" placeholder="Happy Birthday! Have a blast..."></textarea>
        </div>

        <div class="input-group">
            <label>3. Select Music:</label>
            <select id="user-music">
                <option value="https://codeskulptor-demos.commondatastorage.googleapis.com/GalaxyInvaders/theme.mp3">Instrumental Tune</option>
                <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Party Music</option>
                <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Soft Melody</option>
            </select>
        </div>

        <div class="input-group">
            <label>4. Choose Animation:</label>
            <select id="user-animation">
                <option value="balloons">🎈 Floating Balloons</option>
                <option value="confetti">🎉 Party Confetti</option>
                <option value="stars">⭐ Shining Stars</option>
            </select>
        </div>

        <button id="generate-btn">Create Magic Link ✨</button>
    </div>

    <div id="birthday-card" class="card hidden">
        <img id="display-pic" src="" alt="Birthday Pic" class="profile-pic">
        <h1 class="title">Happy Birthday!</h1>
        <p id="display-msg" class="message"></p>
        <button id="wishBtn">Click for Surprise! ❤️</button>
    </div>

    <div id="animation-container"></div>
    <audio id="birthdayMusic" loop></audio>

    <script src="script.js"></script>
</body>
</html>
